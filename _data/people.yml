- name: Kateryna M.
  role: Family Routines & Infant Care
  origin: VIP guest relations and private hospitality
  region: Infants & bedtime · Family routines
  code: EM-01
  image: kateryna.webp
  tags:
  - Infant routines
  - Bedtime transitions
  - Parent handovers
  pitch: Kateryna works with families who value a predictable, unhurried end to the day. She learns each child’s
    routines before introducing changes, keeps transitions calm, and communicates clearly with parents. Her composed
    manner is especially reassuring when several children need something at once.
  signature: During a multi-child evening placement, Kateryna coordinated separate bedtime routines while preserving
    each child’s familiar rituals. By the end of the week, the family had a schedule everyone could follow.
  training: Infant and preschool routines · Settling and sleep transitions · Family communication · Consistent care
    handovers
  approach: The best evening routine is one the children recognize and the parents can maintain.
  previous_role: Before Encore, Kateryna oversaw VIP guest relations in casino and private-hospitality settings.
    She became accustomed to confidential requests, changing schedules and guests who expected immediate attention.
    She finds that patience, preparation and discretion transfer remarkably well to family life.
- name: Mila P.
  role: Movement & Early Years Enrichment
  origin: Professional cheerleading and live-event coaching
  region: Toddlers & preschoolers · Active play
  code: EM-02
  image: mila.webp
  tags:
  - Active play
  - Movement routines
  - Outdoor time
  pitch: Mila brings structure and enthusiasm to energetic households. She plans age-appropriate movement, games
    and outdoor activities around each child’s interests and abilities. Her approach combines patience, clear boundaries
    and an unusual capacity to keep up with children who appear to have unlimited energy.
  signature: For a family with three children under six, Mila developed a simple afternoon circuit of games, balance
    activities and outdoor play. The children began asking for their daily “practice,” and evenings became noticeably
    easier.
  training: Age-appropriate movement · Group activities · Positive reinforcement · Active indoor and outdoor play
  approach: Children do better when there is room to move, something worth trying and a clear next step.
  previous_role: Mila spent several years in professional cheerleading, choreography and event-performance coaching.
    Coordinating large teams, maintaining energy through long schedules and keeping everyone on cue gave her a practical
    appreciation for rhythm, encouragement and the value of a well-timed break.
- name: Anastasia V.
  role: Family Meals & Culinary Care
  origin: Professional dance and private-event hospitality
  region: Family meals · Food preferences
  code: EM-03
  image: anastasia.webp
  tags:
  - Family meal plans
  - Selective eaters
  - Lunch preparation
  pitch: Anastasia approaches family food with equal attention to nourishment, presentation and the realities of
    feeding children. She works from household preferences and parent-provided dietary instructions, preparing practical
    meals and snacks that look as thoughtful as they taste.
  signature: After learning that one preschooler was reluctant to try unfamiliar vegetables, Anastasia changed the
    presentation rather than the menu. Within weeks, the child was helping assemble the family’s lunchboxes and
    suggesting new combinations.
  training: Family menu coordination · Ingredient preparation · Mealtime routines · Parent-directed allergy and
    dietary instructions
  approach: A good meal should be simple to enjoy and easy for the family to repeat.
  previous_role: Anastasia worked as a professional dancer and later supported private events where timing, presentation
    and attention to guests were essential. The emphasis on preparation stayed with her; in her current work, she
    applies it to family meals, with far less interest in applause.
- name: Sofia K.
  role: Household Organization & Home Care
  origin: Luxury event operations and private-home coordination
  region: Home systems · Everyday organization
  code: EM-04
  image: sofia.webp
  tags:
  - Laundry & linens
  - Playroom resets
  - Household systems
  pitch: Sofia creates order that lasts beyond a single tidy afternoon. She focuses on laundry, kitchens, shared
    spaces and the practical organization that makes family routines easier. Her preferred systems are simple enough
    for the whole household to use, even when everyone is moving in different directions.
  signature: Sofia helped a growing family reorganize its entryway, children’s clothing and school-day supplies.
    What began as a short household reset became the arrangement they continued using throughout the school year.
  training: Laundry and linen care · Family-space organization · Household task sequencing · Practical continuity
    checklists
  approach: A well-run home should make the next task easier, not create another task to manage.
  previous_role: Sofia managed luxury events and private hospitality operations, where supplies, staffing and presentation
    had to be coordinated without interrupting the experience. She is accustomed to the details that guests never
    notice—unless they have been overlooked.
- name: Viktoria S.
  role: Multi-Child & Overnight Care
  origin: Casino-floor hospitality and evening guest operations
  region: Large families · Evening & overnight support
  code: EM-05
  image: viktoria.webp
  tags:
  - Evening routines
  - Sibling coordination
  - Overnight support
  pitch: Viktoria is most at home in busy households that need calm, organized support during the late afternoon,
    evening or overnight. She pays close attention to each child’s needs while keeping family routines consistent,
    particularly when plans change or several requests arrive together.
  signature: During an overnight family placement, Viktoria kept four children on their separate evening routines,
    managed an unexpected bedding change and completed a thorough morning handover without disturbing the youngest
    child.
  training: Evening and overnight routines · Multi-child coordination · Parent communication · Planned household
    handovers
  approach: A calm response and a sensible sequence are more useful than trying to do everything at once.
  previous_role: Viktoria supervised casino-floor hospitality and late-shift guest services. She learned to resolve
    delicate situations quietly, work around unconventional hours and stay composed when the requests were urgent
    and not always entirely reasonable.
- name: Elena R.
  role: Private Family Concierge & Logistics
  origin: Five-star hotel and private-residence concierge
  region: Family calendars · Household coordination
  code: EM-06
  image: elena.webp
  tags:
  - Schedules & planning
  - Detailed handovers
  - Discreet support
  pitch: Elena is a natural fit for families who need more than an extra pair of hands. She coordinates calendars,
    children’s activities, household appointments and clear caregiver handovers. Her style is discreet, methodical
    and designed to make a full family schedule feel manageable.
  signature: Elena brought a complex week of school activities, visiting relatives and overlapping appointments
    into a single household plan. The parents received concise daily summaries and found they no longer needed to
    coordinate every detail themselves.
  training: Family activity planning · Schedule coordination · Written handovers · Household communications and
    logistics
  approach: The finest service anticipates what a family needs without making the family manage the service.
  previous_role: Elena spent her earlier career in five-star concierge and private-residence hospitality, organizing
    travel, reservations and last-minute arrangements for guests with exacting expectations. She brought the same
    attention to detail to family life—though the requests now more often involve lost mittens than last-minute
    suites.
