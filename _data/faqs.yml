- q: What makes Encore different from a traditional nanny agency?
  a: Encore brings childcare, meal preparation and agreed household tasks into one coordinated service brief.
    Families can arrange a single specialist, overlapping coverage or planned weekend and overnight support
    without committing to a full-time placement.
- q: How are specialists selected for different households?
  a: Each arrangement begins with a discussion of the children's ages, established routines, family preferences,
    scheduling needs and relevant experience. The proposed specialist and scope of support are reviewed before
    the arrangement is confirmed.
- q: What documentation can a family review before care begins?
  a: The suitability and documentation appropriate to an arrangement should be discussed before care starts.
    This may include identity, references, applicable screening, relevant qualifications and any requirements
    specific to the children. A profile is an introduction, not a substitute for verification.
- q: Why do some specialists have hospitality and performance backgrounds?
  a: 'We value skills developed in high-service environments: discretion, composure, sustained attention, schedule
    coordination and responsiveness. Backgrounds in private hospitality, events, movement instruction and guest
    relations can complement practical family-care strengths. Each profile describes the individual''s focus.'
- q: Can specialists prepare meals and help organize the household?
  a: Yes, where included in the service scope. Support can cover family meal preparation, kitchen tidying,
    children's laundry, playroom organization and preparation for the next day's routines. Extensive cleaning
    or additional staffing is quoted separately.
- q: Can both parents review the proposed care arrangement?
  a: Yes. We recommend that all participating caregivers understand the schedule, specialist responsibilities,
    household priorities, communication preferences and associated costs before care begins.
- q: What will a specialist wear while working in our home?
  a: The working standard is practical, appropriate clothing suited to the children's ages, planned activities
    and family preferences. Professional portrait photography is not intended to represent clothing worn during
    every care assignment.
- q: Is there an option for recurring but part-time support?
  a: Encore Flex offers individual care blocks; Encore Reserve adds recurring scheduling, maintained household
    preferences and preferred specialist coordination for a monthly membership fee. Care hours are billed separately.
- q: Can you support a household with four children over a weekend?
  a: Family Continuity can be structured around one parent's travel or other temporary schedule changes. The
    starting weekend arrangement includes up to 20 scheduled hours with one lead specialist. Additional care
    capacity is determined by the ages, activities and needs of the children and is quoted separately.
- q: What is included in After Midnight Engagements?
  a: The standard overnight arrangement covers an eight-hour window, usually 10 p.m. to 6 a.m., with two specialists
    and a written morning handover, starting at $1,795. Private Residence, from $3,950, includes individually
    scoped preparation, household coordination and extended morning service.
- q: Why is Private Residence priced separately?
  a: Private Residence is a more comprehensive engagement than overnight child supervision. It can include
    planning in advance, dedicated household personnel and work beyond the core overnight shift. The exact
    staffing and deliverables are specified in the proposal.
- q: Where can I review the cancellation and additional service terms?
  a: Shift minimums and starting rates are published on the Services page. The detailed quote and any additional
    charges, deposits, cancellation terms, overtime or travel expenses should be agreed in writing before confirmation.
    The Service Terms page outlines the process.
- q: How do I arrange an initial consultation?
  a: Begin with a private enquiry to outline the service you are considering, your preferred timing and the
    level of support required. The private client office receives your enquiry for follow-up; sending an enquiry
    does not confirm specialist availability or reserve an arrangement.
